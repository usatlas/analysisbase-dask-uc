# trigger uses "github.event.client_payload.ref" tag of the base image 
name: Build on trigger

on:
  repository_dispatch:
    types: gitops-analysis-base-trigger
  workflow_dispatch:
    inputs:
      base_tag:
        description: "Base image tag to build against (e.g. 24.2.26)"
        required: true
        default: "24.2.26"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    name: docker
    runs-on: ubuntu-latest
    permissions:
      contents: read # actions/checkout
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve base tag
        id: base_tag
        env:
          DISPATCH_REF: ${{ github.event.client_payload.ref }}
          DISPATCH_INPUT: ${{ github.event.inputs.base_tag }}
        run: echo "value=${DISPATCH_REF:-$DISPATCH_INPUT}" >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            sslhep/analysis-dask-uc
            hub.opensciencegrid.org/usatlas/analysis-dask-uc
          tags: |
            type=sha,
            type=raw,value=${{ steps.base_tag.outputs.value }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to Harbor Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: hub.opensciencegrid.org
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Test build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          build-args: |
            BASE_TAG=${{ steps.base_tag.outputs.value }}
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          build-args: |
            BASE_TAG=${{ steps.base_tag.outputs.value }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

